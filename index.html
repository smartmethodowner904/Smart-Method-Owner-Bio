<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Boss</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
      background:url('https://images.unsplash.com/photo-1511300636408-a63a89df3482?q=80&w=1200&auto=format&fit=crop') no-repeat center center/cover;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      position:relative;
      overflow:auto;
    }

    body::before{
      content:'';
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.45);
      backdrop-filter:blur(2px);
      z-index:0;
    }

    .container{
      width:100%;
      max-width:420px;
      position:relative;
      z-index:1;
      text-align:center;
      color:white;
    }

    .profile{
      margin-bottom:25px;
    }

    .profile img{
      width:120px;
      height:120px;
      border-radius:50%;
      border:4px solid rgba(255,255,255,0.3);
      object-fit:cover;
      box-shadow:0 0 25px rgba(255,255,255,0.2);
    }

    .title{
      margin-top:15px;
      font-size:38px;
      font-weight:bold;
    }

    .subtitle{
      margin-top:10px;
      font-size:24px;
      color:#e5e5e5;
      font-weight:600;
    }

    .buttons{
      margin-top:30px;
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .btn{
      text-decoration:none;
      color:white;
      background:rgba(255,255,255,0.12);
      border:1px solid rgba(255,255,255,0.18);
      backdrop-filter:blur(12px);
      padding:18px 20px;
      border-radius:22px;
      display:flex;
      align-items:center;
      gap:15px;
      transition:0.3s;
      box-shadow:0 8px 25px rgba(0,0,0,0.25);
    }

    .btn:hover{
      transform:scale(1.03);
      background:rgba(255,255,255,0.2);
    }

    .btn img{
      width:55px;
      height:55px;
      border-radius:50%;
      object-fit:cover;
    }

    .btn span{
      font-size:24px;
      font-weight:600;
    }

    @media(max-width:500px){
      .title{
        font-size:32px;
      }

      .subtitle{
        font-size:20px;
      }

      .btn span{
        font-size:20px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="profile">
      <img src="https://kommodo.ai/i/Gxt5BWqUk2H0VcUsCTpP" alt="">
      <div class="title">Smart Boss</div>
      <div class="subtitle">Smart Method Owner</div>
    </div>

    <div class="buttons">

      <a class="btn" href="https://t.me/Smart_Method_Owner" target="_blank">
        <span>Support ID</span>
      </a>

      <a class="btn" href="https://t.me/Global_Method_Channel" target="_blank">
        <img src="https://kommodo.ai/i/W42aXpyZIuAzMrRAsTXP">
        <span>Telegram Channel</span>
      </a>

      <a class="btn" href="https://t.me/X_method_chat1" target="_blank">
        <img src="https://kommodo.ai/i/KNJ56vIjvUk6mFiFdy2G">
        <span>Support Group</span>
      </a>

      <a class="btn" href="https://www.facebook.com/profile.php?id=61589114365932" target="_blank">
        <img src="https://kommodo.ai/i/aM5m4ndehohYPXxqx1uR">
        <span>Facebook</span>
      </a>

    </div>

  </div>

</body>
</html>

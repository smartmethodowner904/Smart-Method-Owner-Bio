<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Boss</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    background:black;
}

/* VIDEO BACKGROUND */

#bg-video{
    position:fixed;
    right:0;
    bottom:0;
    min-width:100%;
    min-height:100%;
    object-fit:cover;
    z-index:-3;
    filter:brightness(0.7);
}

/* DARK GLASS OVERLAY */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.25);
    backdrop-filter:blur(1px);
    z-index:-2;
}

/* WATER DROP EFFECT */

.water{
    position:absolute;
    width:120px;
    height:120px;
    border-radius:50%;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:
    inset 0 0 20px rgba(255,255,255,0.08),
    0 0 20px rgba(255,255,255,0.08);
    backdrop-filter:blur(3px);
    animation:float 8s linear infinite;
}

.water:nth-child(1){
    top:8%;
    left:15%;
}

.water:nth-child(2){
    top:18%;
    right:12%;
    width:90px;
    height:90px;
}

.water:nth-child(3){
    bottom:18%;
    left:10%;
    width:140px;
    height:140px;
}

.water:nth-child(4){
    bottom:10%;
    right:15%;
    width:80px;
    height:80px;
}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(15px);
    }

    100%{
        transform:translateY(0px);
    }

}

/* MAIN CONTAINER */

.container{
    width:100%;
    max-width:420px;
    position:relative;
    z-index:10;
    text-align:center;
    color:white;
    padding:20px;
}

/* PROFILE */

.profile img{
    width:130px;
    height:130px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid rgba(255,255,255,0.25);
    box-shadow:0 0 30px rgba(255,255,255,0.20);
}

.title{
    margin-top:15px;
    font-size:40px;
    font-weight:bold;
}

.subtitle{
    margin-top:10px;
    font-size:23px;
    color:#ededed;
    font-weight:600;
}

/* BUTTONS */

.buttons{
    margin-top:35px;
    display:flex;
    flex-direction:column;
    gap:18px;
}

.btn{
    text-decoration:none;
    color:white;
    background:rgba(255,255,255,0.07);
    border:1px solid rgba(255,255,255,0.10);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    padding:18px 20px;
    border-radius:28px;
    display:flex;
    align-items:center;
    gap:15px;
    transition:0.3s;
    box-shadow:0 8px 25px rgba(0,0,0,0.30);
}

.btn:hover{
    transform:scale(1.02);
    background:rgba(255,255,255,0.12);
}

.btn img{
    width:58px;
    height:58px;
    border-radius:50%;
    object-fit:cover;
}

.btn span{
    font-size:22px;
    font-weight:600;
}

/* MOBILE */

@media(max-width:500px){

    .title{
        font-size:32px;
    }

    .subtitle{
        font-size:20px;
    }

    .btn span{
        font-size:18px;
    }

}

</style>
</head>

<body>

<!-- VIDEO -->
<video autoplay muted loop playsinline id="bg-video">
    <source src="background.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<!-- WATER DROPS -->
<div class="water"></div>
<div class="water"></div>
<div class="water"></div>
<div class="water"></div>

<!-- MAIN -->
<div class="container">

    <div class="profile">
        <img src="https://i.postimg.cc/8PM44Mmn/IMG-20260509-175105-960.jpg">
        <div class="title">Smart Boss</div>
        <div class="subtitle">Smart Method Owner</div>
    </div>

    <div class="buttons">

        <a class="btn" href="https://t.me/Smart_Method_Owner" target="_blank">
            <img src="https://i.postimg.cc/8PM44Mmn/IMG-20260509-175105-960.jpg">
            <span>Support ID</span>
        </a>

        <a class="btn" href="https://t.me/Global_Method_Channel" target="_blank">
            <img src="https://i.postimg.cc/hPWbXhRx/IMG-20260509-175400-146.jpg">
            <span>Telegram Channel</span>
        </a>

        <a class="btn" href="https://t.me/X_method_chat1" target="_blank">
            <img src="https://i.postimg.cc/qBn2H06X/IMG-20260509-175514-928.jpg">
            <span>Support Group</span>
        </a>

        <a class="btn" href="https://t.me/+75BQ2Qw9UZI4OTM1" target="_blank">
            <img src="https://i.postimg.cc/6Q2yVLdc/IMG-20260509-175408-150.jpg">
            <span>Second Channel</span>
        </a>

        <a class="btn" href="https://www.facebook.com/profile.php?id=61589114365932" target="_blank">
            <img src="https://i.postimg.cc/wjS6zKmy/1778330154160.jpg">
            <span>Facebook</span>
        </a>

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Boss</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?q=80&w=1200&auto=format&fit=crop') no-repeat center center/cover;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:auto;
    position:relative;
    padding:20px;
}

body::before{
    content:'';
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.30);
    backdrop-filter:blur(2px);
    z-index:0;
}

.container{
    width:100%;
    max-width:420px;
    position:relative;
    z-index:2;
    text-align:center;
    color:white;
}

.profile{
    margin-bottom:25px;
}

.profile img{
    width:130px;
    height:130px;
    border-radius:50%;
    object-fit:cover;
    border:4px solid rgba(255,255,255,0.3);
    box-shadow:0 0 25px rgba(255,255,255,0.2);
}

.title{
    margin-top:15px;
    font-size:40px;
    font-weight:bold;
}

.subtitle{
    margin-top:10px;
    font-size:24px;
    color:#e6e6e6;
    font-weight:600;
}

.buttons{
    margin-top:35px;
    display:flex;
    flex-direction:column;
    gap:18px;
}

.btn{
    text-decoration:none;
    color:white;
    background:rgba(255,255,255,0.10);
    border:1px solid rgba(255,255,255,0.18);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    padding:18px 20px;
    border-radius:22px;
    display:flex;
    align-items:center;
    gap:15px;
    transition:0.3s;
    box-shadow:0 8px 25px rgba(0,0,0,0.25);
}

.btn:hover{
    transform:scale(1.03);
    background:rgba(255,255,255,0.18);
}

.btn img{
    width:55px;
    height:55px;
    border-radius:50%;
    object-fit:cover;
}

.btn span{
    font-size:23px;
    font-weight:600;
}

.rain{
    position:fixed;
    top:-100px;
    width:2px;
    height:90px;
    background:rgba(255,255,255,0.35);
    animation:rainFall linear infinite;
    z-index:1;
}

@keyframes rainFall{

    0%{
        transform:translateY(-100px);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    100%{
        transform:translateY(120vh);
        opacity:0;
    }
}

@media(max-width:500px){

    .title{
        font-size:32px;
    }

    .subtitle{
        font-size:20px;
    }

    .btn span{
        font-size:19px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="profile">
        <img src="https://i.postimg.cc/8PM44Mmn/IMG-20260509-175105-960.jpg">
        <div class="title">Smart Boss</div>
        <div class="subtitle">Smart Method Owner</div>
    </div>

    <div class="buttons">

        <a class="btn" href="https://t.me/Smart_Method_Owner" target="_blank">
            <span>Support ID</span>
        </a>

        <a class="btn" href="https://t.me/Global_Method_Channel" target="_blank">
            <img src="https://i.postimg.cc/hPWbXhRx/IMG-20260509-175400-146.jpg">
            <span>Telegram Channel</span>
        </a>

        <a class="btn" href="https://t.me/X_method_chat1" target="_blank">
            <img src="https://i.postimg.cc/qBn2H06X/IMG-20260509-175514-928.jpg">
            <span>Support Group</span>
        </a>

        <a class="btn" href="https://t.me/+75BQ2Qw9UZI4OTM1" target="_blank">
            <img src="https://i.postimg.cc/6Q2yVLdc/IMG-20260509-175408-150.jpg">
            <span>Send CD Channel</span>
        </a>

        <a class="btn" href="https://www.facebook.com/profile.php?id=61589114365932" target="_blank">
            <img src="https://i.postimg.cc/wjS6zKmy/1778330154160.jpg">
            <span>Facebook</span>
        </a>

    </div>

</div>

<script>

for(let i = 0; i < 120; i++){

    let drop = document.createElement("div");

    drop.classList.add("rain");

    drop.style.left = Math.random() * window.innerWidth + "px";

    drop.style.animationDuration = (Math.random() * 1 + 0.5) + "s";

    drop.style.animationDelay = Math.random() * 5 + "s";

    document.body.appendChild(drop);

}

</script>

</body>
</html>
